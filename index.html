<style>
:root{--bg:#0a1018;--tab:rgba(16,24,34,.8);--tabline:rgba(255,255,255,.22);--tabink:#e9eef4;--brand:#7f0a1f;--brandline:#b0213b}

#stage{position:fixed;inset:0;background:var(--bg)}

#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:linear-gradient(rgba(6,10,16,0),rgba(6,10,16,.8) 55%)}
.tab{flex:0 0 auto;border:1px solid var(--tabline);background:var(--tab);color:var(--tabink);border-radius:999px;padding:10px 16px;
  font:600 15px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (max-width:900px),(max-height:500px){.tab{font-size:13px;padding:8px 12px}#tabs{gap:6px;padding-top:10px}}

  border:1px solid var(--tabline);background:rgba(16,24,34,.6);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
#fs[hidden]{display:none}
#fs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

<body>
<div id="stage"><canvas id="cv" aria-label="Hockey drill animation"></canvas></div>
<nav id="tabs" aria-label="Drills"></nav>
<button id="fs" type="button" aria-label="Full screen" hidden><svg viewBox="0 0 24 24"><path id="fsIcon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<script>
(()=>{
'use strict';
const FITM=1.06;
// ===== math =====
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const ramp=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const smooth=k=>{k=clamp(k,0,1);return k*k*(3-2*k);};
const easeOut=k=>1-Math.pow(1-clamp(k,0,1),2);
const backOut=k=>{k=clamp(k,0,1);const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const L2=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];
const norm=a=>{const l=Math.hypot(a[0],a[1])||1;return [a[0]/l,a[1]/l];};
const ang=a=>Math.atan2(a[1],a[0]);
const dirA=t=>[Math.cos(t),Math.sin(t)];
const hump=(d,w)=>{const k=d/w;return k*k<1?1-k*k:0;};
function angLerp(a,b,k){const d=((b-a+PI)%TAU+TAU)%TAU-PI;return a+d*k;}

// ===== tracks =====
// keyframes [[t,x,z],...] -> t=>[x,z] (cubic hermite, stops are smooth)
function kf(keys){
  const n=keys.length;
  const m=keys.map((k,i)=>{
    if(i===0||i===n-1)return[0,0];
    const a=keys[i-1],b=keys[i+1];
    if((a[1]===k[1]&&a[2]===k[2])||(b[1]===k[1]&&b[2]===k[2]))return[0,0];
    const dt=b[0]-a[0];return[(b[1]-a[1])/dt,(b[2]-a[2])/dt];
  });
  return t=>{
    if(t<=keys[0][0])return[keys[0][1],keys[0][2]];
    if(t>=keys[n-1][0])return[keys[n-1][1],keys[n-1][2]];
    let i=0;while(i<n-2&&t>keys[i+1][0])i++;
    const a=keys[i],b=keys[i+1],h=b[0]-a[0],u=(t-a[0])/h,u2=u*u,u3=u2*u;
    const h00=2*u3-3*u2+1,h10=u3-2*u2+u,h01=-2*u3+3*u2,h11=u3-u2;
    return[h00*a[1]+h10*h*m[i][0]+h01*b[1]+h11*h*m[i+1][0],h00*a[2]+h10*h*m[i][1]+h01*b[2]+h11*h*m[i+1][1]];
  };
}
// constant-speed polyline (slower in arcs, accelerates from start)
function polyPath(pts,t0,v,noAcc){
  const T=[t0];let dist=0;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],L=Math.hypot(b.x-a.x,b.z-a.z);
    const sp=v*(b.arc?0.72:1)*(noAcc?1:Math.min(1,0.35+0.65*dist/14));
    T.push(T[i-1]+L/sp);dist+=L;
  }
  const at=t=>{
    const n=pts.length;
    if(t<=T[0])return{x:pts[0].x,z:pts[0].z,tgt:pts[1]&&pts[1].tgt};
    if(t>=T[n-1])return{x:pts[n-1].x,z:pts[n-1].z,tgt:pts[n-1].tgt,done:1};
    let i=1;while(T[i]<t)i++;
    const u=(t-T[i-1])/(T[i]-T[i-1]),a=pts[i-1],b=pts[i];
    return{x:lerp(a.x,b.x,u),z:lerp(a.z,b.z,u),arc:!!b.arc,tgt:b.tgt};
  };
  return{at,T,tEnd:T[T.length-1],pts};
}
// tight turn around cone C coming from P, leaving toward N
function turnAround(P,C,N,r){
  let best=null;
  for(const s of[1,-1]){
    const d=norm(sub(C,P)),n=[-d[1]*s,d[0]*s],w=-s;let th=ang(n);const pts=[];let k=0;
    for(;k<=340;k+=12){
      const a=th+w*k*PI/180,Q=[C[0]+r*Math.cos(a),C[1]+r*Math.sin(a)];
      pts.push(Q);
      const tg=[w*-Math.sin(a),w*Math.cos(a)],toN=norm(sub(N,Q));
      if(k>=168&&tg[0]*toN[0]+tg[1]*toN[1]>0.9)break;
    }
    if(!best||k<best.k)best={k,pts};
  }
  return best.pts;
}
function racePath(start,cones,end,r){
  const pts=[{x:start[0],z:start[1]}],ts=[],te=[];let P=start;
  cones.forEach((C,i)=>{
    const N=i<cones.length-1?cones[i+1]:end,arc=turnAround(P,C,N,r);
    ts.push(pts.length);
    arc.forEach((q,j)=>pts.push({x:q[0],z:q[1],arc:j>0,tgt:j===0?C:N}));
    te.push(pts.length-1);P=arc[arc.length-1];
  });
  pts.push({x:end[0],z:end[1],tgt:end});
  return{pts,ts,te};
}

// ===== actors =====
let CUR=null;
function evalActor(d,t){
  const s=Object.assign({},d.fn(t));
  s.team=s.team||d.team;s.id=d.id;
  if(s.hidden)return s;
  if(s.face==null||s.speed==null){
    const a=d.fn(t-0.12),b=d.fn(t+0.12),vx=b.x-a.x,vz=b.z-a.z,sp=Math.hypot(vx,vz)/0.24;
    if(s.speed==null)s.speed=sp;
    if(s.face==null){
      const bk=s.backness!=null?s.backness:(s.back?1:0),fm=sp>0.3?Math.atan2(vz,vx)+PI*bk:null;
      if(s.lookAt){const fl=Math.atan2(s.lookAt[1]-s.z,s.lookAt[0]-s.x);s.face=fm==null?fl:angLerp(fm,fl,1-smooth(ramp(sp,0.5,3.5)));}
      else if(fm!=null)s.face=fm;
      else{let f=null;for(let k=1;k<=10&&f==null;k++){const q=d.fn(t-0.3*k);if(Math.hypot(s.x-q.x,s.z-q.z)>0.5)f=Math.atan2(s.z-q.z,s.x-q.x)+PI*(q.backness!=null?q.backness:(q.back?1:0));}s.face=f==null?(d.face0||0):f;}
    }
  }
  return s;
}
const bodyScale=s=>s.team==='coach'?1.55:1.3;
function crouchOf(s){if(s.pose==='goalie')return 0.6;const c=s.crouch!=null?s.crouch:(s.team==='coach'?0.12:0.45);return Math.max(c,0.75*(s.hk||0));}
function frame(s){
  const S=bodyScale(s),fx=Math.cos(s.face||0),fz=Math.sin(s.face||0),ly=s.lift||0;
  return{S,P:(fw,sd,up)=>[s.x+(fx*fw-fz*sd)*S,up*S+ly,s.z+(fz*fw+fx*sd)*S]};
}
function stickGeom(s,t){
  const{P}=frame(s),c=crouchOf(s);let bfw=1.95+0.45*c,bsd=-0.3,by=0.1,pl=null,thF=0.38*(s.handsOut||0),thU=0;
  const d=s.dribble;
  if(d){
    const w=d.w==null?1:d.w,ph=(t-(d.t0||0))*(d.speed||5)+(s.seed||0)*0.9;
    if(d.mode==='front')bsd+=Math.sin(ph)*d.amp*w;
    else if(d.mode==='side'){bsd+=d.side*1.25*w+Math.sin(ph)*0.4*w;bfw-=0.25*w;}
    else if(d.mode==='push')bfw+=Math.sin(ph)*0.8*w;
    else if(d.mode==='carry')bsd+=Math.sin(ph)*0.3;
    else if(d.mode==='offset'){bfw+=d.fw||0;bsd+=d.sd||0;}
    else if(d.mode==='kick'){
      const u=(((t-d.t0)*0.42+(s.seed||0)*0.07)%1+1)%1,sk=[0.55,-0.5],b0=bfw;
      if(u<0.35){const k=smooth(u/0.35);bfw=lerp(b0,1.05,k);bsd=lerp(-0.3,-0.75,k);}
      else if(u<0.5){const k=smooth((u-0.35)/0.15);bfw=lerp(1.05,1.6,k);bsd=lerp(-0.75,-0.2,k);pl=sk;}
      else if(u<0.72){const k=smooth((u-0.5)/0.22);bfw=lerp(1.6,b0,k);bsd=lerp(-0.2,-0.3,k);pl=[lerp(sk[0],bfw+0.42,k),lerp(sk[1],bsd-0.32,k)];}
    }
  }
  if(s.shot!=null){
    // wrist shot: load back (0-.3), sweep heel->toe (.3-.62, release), follow through (.62-1), hold (1-1.5), relax (1.5-2)
    const u=clamp(s.shot,0,2),b0=[bfw,bsd,by],ft=[3.15,-0.12,1.35];
    const K=[[0,b0],[0.3,[0.9,-1.2,0.1]],[0.62,[2.65,-0.62,0.1]],[1,ft],[1.5,ft],[2,b0]];
    let i=0;while(i<K.length-2&&u>K[i+1][0])i++;
    const k=smooth(ramp(u,K[i][0],K[i+1][0])),A=K[i][1],B=K[i+1][1];
    bfw=lerp(A[0],B[0],k);bsd=lerp(A[1],B[1],k);by=lerp(A[2],B[2],k);
    const rl=1-smooth(ramp(u,1.5,2));
    thF+=(-0.35*smooth(ramp(u,0.3,0.62))*(1-smooth(ramp(u,0.62,1)))+0.3*smooth(ramp(u,0.62,1)))*rl;thU+=0.55*smooth(ramp(u,0.62,1))*rl;
    if(u<0.7){const r=smooth(ramp(u,0.3,0.62));pl=[bfw+0.42+0.12*r,bsd-0.28-0.5*r];}
  }
  pl=pl||[bfw+0.42,bsd-0.32];
  const pw=P(pl[0],pl[1],0);
  return{heel:[bfw,bsd],toe:[bfw+0.25,bsd-0.7],by,thF,thU,puck:[pw[0],pw[2]]};
}
function carryPos(id,t){return stickGeom(evalActor(CUR.byId[id],t),t).puck;}
function res(ref,t){return typeof ref==='string'?carryPos(ref,t):typeof ref==='function'?ref(t):ref;}
function alongPts(pts,u){
  let tot=0;const L=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(l);tot+=l;}
  let d=u*tot;for(let i=0;i<L.length;i++){if(d<=L[i]||i===L.length-1)return L2(pts[i],pts[i+1],L[i]?clamp(d/L[i],0,1):1);d-=L[i];}
  return pts[pts.length-1];
}
// puck segments: ['at',t0,t1,[x,z]] ['carry',t0,t1,id] ['move',t0,t1,from,to,{ease,arc,via}]
function puckTrack(segs){
  const ev=(s,t)=>{
    const[k,t0,t1,a,b,o]=s;
    if(k==='at')return[a[0],0,a[1]];
    if(k==='carry'){const p=carryPos(a,t);return[p[0],0,p[1]];}
    const A=res(a,t0),B=res(b,t1);let u=ramp(t,t0,t1);if(o&&o.ease==='out')u=easeOut(u);
    const p=o&&o.via?alongPts([A,...o.via,B],u):L2(A,B,u);
    return[p[0],o&&o.arc?o.arc*4*u*(1-u):0,p[1]];
  };
  return t=>{
    for(let j=0;j<segs.length;j++){const s=segs[j];if(t>=s[1]&&t<s[2]){
      let p=ev(s,t);
      if(s[0]==='carry'&&j>0&&t-s[1]<0.3){const q=ev(segs[j-1],s[1]-1e-4),k=smooth((t-s[1])/0.3);p=[lerp(q[0],p[0],k),lerp(q[1],p[1],k),lerp(q[2],p[2],k)];}
      return p;}}
    return null;
  };
}

// ===== camera / projection =====
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=300,H=300;
const cam={ex:0,ey:0,ez:0,r:[1,0,0],u:[0,1,0],f:[0,0,1],F:400,cx:0,cy:0};
const NEAR=0.8;
const view={yaw:0,pitch:0,zoom:1};
let BAR=0;
function setCam(c){
  const Hh=Math.max(100,H-BAR),port=Hh>W*1.08,F=Math.max(W,Hh)*0.5/Math.tan(0.6);
  const pitch=clamp(c.pitch+view.pitch,0.12,1.52),yaw=c.yaw+view.yaw-(port?PI/2:0),cp=Math.cos(pitch),T=c.target;
  let dist=c.dist||80;
  if(c.w){const tH=W*0.5/F,tV=Hh*0.5/F,w=port?c.h:c.w,h=port?c.w:c.h;dist=Math.max(w/(2*tH),h*Math.sin(pitch)/(2*tV))*FITM;}
  dist*=view.zoom;
  cam.ex=T[0]+dist*cp*Math.cos(yaw);cam.ey=T[1]+dist*Math.sin(pitch);cam.ez=T[2]+dist*cp*Math.sin(yaw);
  let fx=T[0]-cam.ex,fy=T[1]-cam.ey,fz=T[2]-cam.ez;const fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;
  let rx=-fz,rz=fx;const rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
  cam.r=[rx,0,rz];cam.u=[-rz*fy,rz*fx-rx*fz,rx*fy];cam.f=[fx,fy,fz];
  cam.F=F;cam.cx=W/2;cam.cy=Hh*0.5;
}
function toCam(x,y,z){const vx=x-cam.ex,vy=y-cam.ey,vz=z-cam.ez;return[vx*cam.r[0]+vz*cam.r[2],vx*cam.u[0]+vy*cam.u[1]+vz*cam.u[2],vx*cam.f[0]+vy*cam.f[1]+vz*cam.f[2]];}
const toCamP=p=>toCam(p[0],p[1],p[2]);
const projC=c=>[cam.cx+c[0]*cam.F/c[2],cam.cy-c[1]*cam.F/c[2]];
function clipCam(cs){const o=[],n=cs.length;for(let i=0;i<n;i++){const a=cs[i],b=cs[(i+1)%n],ia=a[2]>=NEAR,ib=b[2]>=NEAR;if(ia)o.push(a);if(ia!==ib){const k=(NEAR-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,NEAR]);}}return o;}
function pathPoly(w){const c=clipCam(w.map(toCamP));if(c.length<3)return false;c.forEach((q,i)=>{const p=projC(q);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});ctx.closePath();return true;}
function fillPoly(w,fill,stroke,lw){ctx.beginPath();if(!pathPoly(w))return;if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function fillRing(o,i,fill){ctx.beginPath();if(!pathPoly(o))return;pathPoly(i.slice().reverse());ctx.fillStyle=fill;ctx.fill('evenodd');}
function seg2(a,b){let A=toCamP(a),B=toCamP(b);if(A[2]<NEAR&&B[2]<NEAR)return null;
  if(A[2]<NEAR){const k=(NEAR-A[2])/(B[2]-A[2]);A=[A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k,NEAR];}
  else if(B[2]<NEAR){const k=(NEAR-B[2])/(A[2]-B[2]);B=[B[0]+(A[0]-B[0])*k,B[1]+(A[1]-B[1])*k,NEAR];}
  return[projC(A),projC(B),(A[2]+B[2])/2];}
function line3(a,b,w,col,minPx){const s=seg2(a,b);if(!s)return;ctx.strokeStyle=col;ctx.lineWidth=Math.max(minPx||1,w*cam.F/s[2]);ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);ctx.lineTo(s[1][0],s[1][1]);ctx.stroke();}
const circ=(x,z,r,y,n)=>{y=y||0;n=n||24;const p=[];for(let i=0;i<n;i++){const a=i/n*TAU;p.push([x+r*Math.cos(a),y,z+r*Math.sin(a)]);}return p;};
function hull(p){p.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
  for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
  up.pop();lo.pop();return lo.concat(up);}
function hullFill(w,fill,stroke){const s=[];for(const p of w){const c=toCamP(p);if(c[2]<NEAR)return;s.push(projC(c));}const h=hull(s);if(h.length<3)return;
  ctx.beginPath();h.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=1;ctx.strokeStyle=stroke;ctx.stroke();}}

// ===== rink =====
function rinkPts(){const L=100,Wd=42.5,R=28,p=[],cs=[[L-R,Wd-R,0],[-(L-R),Wd-R,PI/2],[-(L-R),-(Wd-R),PI],[L-R,-(Wd-R),1.5*PI]];
  for(const[cx,cz,a0]of cs)for(let i=0;i<=8;i++){const a=a0+i/8*PI/2;p.push([cx+R*Math.cos(a),0,cz+R*Math.sin(a)]);}return p;}
const RINK=rinkPts();
const RED='#d0283c',BLUEL='#2b5fcf';
function drawWalls(front){
  const n=RINK.length;
  for(let i=0;i<n;i++){
    const a=RINK[i],b=RINK[(i+1)%n],dx=b[0]-a[0],dz=b[2]-a[2],l=Math.hypot(dx,dz);if(l<1e-6)continue;
    const nx=-dz/l,nz=dx/l,mx=(a[0]+b[0])/2,mz=(a[2]+b[2])/2;
    if(((cam.ex-mx)*nx+(cam.ez-mz)*nz<0)!==front)continue;
    const top=[[a[0],3.5,a[2]],[b[0],3.5,b[2]]];
    if(front){fillPoly([[a[0],0,a[2]],[b[0],0,b[2]],top[1],top[0]],'rgba(240,244,248,0.2)');line3(top[0],top[1],0.3,'rgba(40,60,80,.5)');}
    else{
      fillPoly([top[0],top[1],[b[0],9,b[2]],[a[0],9,a[2]]],'rgba(170,215,240,0.10)','rgba(255,255,255,0.16)');
      const sh=0.88+0.12*(nx*0.5+nz*0.85),c=v=>Math.round(v*sh);
      fillPoly([[a[0],0,a[2]],[b[0],0,b[2]],top[1],top[0]],`rgb(${c(244)},${c(247)},${c(250)})`);
      fillPoly([[a[0],0,a[2]],[b[0],0,b[2]],[b[0],0.75,b[2]],[a[0],0.75,a[2]]],'#e6bb2c');
      line3(top[0],top[1],0.35,'#2e4257');
    }
  }
}
function drawIce(){
  fillPoly(RINK,'#e8f1f8');

  const puckXZ=t=>{for(const sg of SEG)if(t>=sg[1]&&t<sg[2]){const[kind,t0,t1,a,b]=sg,R=(r,tt)=>typeof r==='string'?KP[r](tt):r;
    if(kind==='at')return a;if(kind==='carry')return KP[a](t);return L2(R(a,t0),R(b,t1),ramp(t,t0,t1));}return TI;};
  const carry={A:[[0,r1],[7.72,r4],[9.8,r5]],B:[[4.72,r2],[14.82,r7]],C:[[6.22,r3],[13.4,r6]]};
  const shots={A:[[3.8,[-60.6,-11.2]],[8.1,TI],[12.6,[-49,-32]]],B:[[5.5,[-50,-29.2]],[15.25,TI]],C:[[6.85,[-77.2,-27.8]],[14.0,[-64.6,-13.6]]]};
  const recv={A:[[7.0,7.72,'C']],B:[[4.0,4.72,'A'],[14.2,14.82,'C']],C:[[5.6,6.22,'B'],[12.8,13.4,'A']]};
  const sight={A:[[3.1,3.85,'B'],[12.0,12.65,'C']],B:[[5.0,5.55,'C']],C:[[6.35,6.9,'A'],[13.5,14.05,'B']]};
  const aim={A:[[7.8,8.15]],B:[[14.9,15.3]]};
  for(const id of['A','B','C']){const k=kf(K[id]);
    A.push({id,team:'blue',fn:t=>{const q=k(t),pk=puckXZ(t),s={x:q[0],z:q[1],seed:id.charCodeAt(0)*0.37,lookAt:Math.hypot(pk[0]-q[0],pk[1]-q[1])<2?TI:pk};
      for(const w of carry[id])if(inW(t,w[0],w[1]))s.dribble={mode:'carry',t0:0};
      for(const w of recv[id])if(inW(t,w[0],w[1])){s.handsOut=0.7;}

      for(const[ts,tg]of shots[id]){const u=shotU(t,ts,0.6,0.5);if(u!=null){s.shot=u;s.lookAt=tg;}if(inW(t,ts-0.45,ts))s.lookAt=tg;}
      return s;}});}
  {const k=kf(K.X);A.push({id:'X',team:'red',fn:t=>{const q=k(t);return{x:q[0],z:q[1],seed:3.3,lookAt:puckXZ(t),crouch:0.55,handsOut:0.4};}});}
  fx.push({kind:'burst',t0:8.67,t1:9.9,at:TI,r:6},{kind:'burst',t0:15.8,t1:17,at:TI,r:6});
  return{name:'3 On 1 With Tire',nets:[],cam:{target:[-63,0,-22],yaw:PI/2,pitch:0.98,w:58,h:40},actors:A,pucks:[P],fx,
    props:[...dashes([[[-99.4,-0.6],[-30,-0.6]],[[-30,-42.2],[-30,-0.6]]]),{type:'tire',at:TI,t0:0.3}],
    steps:[[0,2.5],[2.5,9.4,0.85],[9.4,11.5],[11.5,16.3,0.85],[16.3,18]]};
}

// ===== Drill 5: Sharks & Minnows (full ice) =====
function dSharks(){
  const dt=1/30,A=[],fx=[],rnd=mkRnd(21),NM=10,ZX=24;
  const lanes=Array.from({length:NM},(_,i)=>lerp(-31,31,i/(NM-1)));
  const S0=[[-5,-23],[11,-4],[-7,9],[14,24]];
  const ag=[];for(let i=0;i<NM;i++)ag.push({id:'M'+i,i});for(let k=0;k<S0.length;k++)ag.push({id:'S'+k,k});
  let t=0,active=false,sideX=80,winner=null,winT=0;const rT=[],tags=[];
  const homes=()=>{const sh=ag.filter(a=>a.shark).sort((a,b)=>a.z-b.z),n=sh.length;
    sh.forEach((a,j)=>{if(n<=S0.length&&a.k!=null){a.hx=S0[a.k][0];a.hz=S0[a.k][1];}else{a.hx=[-12,0,12][j%3];a.hz=lerp(-33,33,(j+0.5)/n);}});};
  const setup=side=>{ag.forEach(a=>{
      if(a.k!=null){a.shark=true;a.x=S0[a.k][0];a.z=S0[a.k][1];a.hd=side>0?0:PI;a.vmax=13.4+rnd()*1.0;a.turn=0;}
      else{a.shark=false;a.x=side*87;a.z=a.lane=lanes[a.i];a.hd=side>0?PI:0;a.state='wait';a.vmax=13.2+rnd()*2.2;a.turn=rnd()<0.5?1:-1;}
      a.sp=0;a.freeze=0;a.react=rnd()*0.35;a.victim=false;});homes();};
  const kin=(a,dh,want,om,acc,dec)=>{if(dh!=null){let d=((dh-a.hd+PI)%TAU+TAU)%TAU-PI;if(Math.abs(d)>2.75&&a.turn)d=a.turn*Math.abs(d);
      a.hd+=clamp(d,-om*dt,om*dt);if(Math.abs(d)>1.1)want=Math.min(want,6.5);}
    a.sp+=clamp(want-a.sp,-dec*dt,acc*dt);a.x+=Math.cos(a.hd)*a.sp*dt;a.z+=Math.sin(a.hd)*a.sp*dt;};
  const stepMinnow=m=>{let want=0,dh=m.x>0?PI:0;
    if(m.state==='go'&&t>=m.goT){
      if(m.power&&m.wp===0&&m.x<m.wps[0][0])m.wp=1;
      if(m.power&&m.wp===1&&m.x>m.wps[1][0])m.wp=2;
      let gx,gz,fin=false;
      if(m.power&&m.wp<2){gx=m.wps[m.wp][0];gz=m.wps[m.wp][1];}else{gx=m.power?m.stopX:m.dir*84;gz=m.lane;fin=true;}
      const fdir=m.power&&m.wp===1?1:m.dir;
      let dx=gx-m.x,dz=(gz-m.z)*0.7;const dl=Math.hypot(dx,dz)||1;dx/=dl;dz/=dl;
      let ax=0,az=0;const avW=m.victim?0.3:1.5;
      for(const s of ag){if(!s.shark)continue;const rx=m.x-s.x,rz=m.z-s.z,d=Math.hypot(rx,rz);if(d>15||d<1e-3)continue;
        if((s.x-m.x)*fdir<-4)continue;const w=avW*Math.pow(1-d/15,2);ax+=rx/d*w*0.6;az+=rz/d*w*1.6;}
      for(const o of ag){if(o.shark||o===m)continue;const rx=m.x-o.x,rz=m.z-o.z,d=Math.hypot(rx,rz);if(d<3.5&&d>1e-3){const w=0.5*(1-d/3.5);ax+=rx/d*w;az+=rz/d*w;}}
      if(m.z>34)az-=(m.z-34)*0.4;if(m.z<-34)az+=(-34-m.z)*0.4;
      let vx=dx+ax,vz=dz+az;const pr=vx*dx+vz*dz;if(pr<0.35){vx+=(0.35-pr)*dx;vz+=(0.35-pr)*dz;}
      dh=Math.atan2(vz,vx);want=m.vmax*(m.victim?0.9:1);
      if(fin){const dist=Math.abs(gx-m.x);want=Math.min(want,Math.sqrt(2*7*Math.max(0,dist-0.4)));if(dist<1.2&&m.sp<1.5)m.state='done';}
    }
    kin(m,dh,want,3.4,7,14);};
  const stepShark=(s,map)=>{let gx=s.hx,gz=s.hz,want=0,dh=null;const tg=map.get(s);
    if(tg&&t>=s.freeze){const d=Math.hypot(tg.x-s.x,tg.z-s.z),ld=clamp(d/16,0,0.8);gx=tg.x+Math.cos(tg.hd)*tg.sp*ld;gz=tg.z+Math.sin(tg.hd)*tg.sp*ld;want=tg.victim?s.vmax:s.vmax*0.8;}
    else if(t>=s.freeze){want=Math.min(9,Math.hypot(gx-s.x,gz-s.z)*1.2);}
    gx=clamp(gx,-ZX+1,ZX-1);
    if(Math.hypot(gx-s.x,gz-s.z)>0.6)dh=Math.atan2(gz-s.z,gx-s.x);else{want=0;dh=sideX>s.x?0:PI;}
    kin(s,dh,want,4.2,9,14);s.x=clamp(s.x,-ZX,ZX);};
  const assign=()=>{const map=new Map(),sh=ag.filter(a=>a.shark&&t>=a.freeze),cand=ag.filter(m=>!m.shark&&m.state==='go'&&t>=m.goT&&m.x*m.dir<ZX+1.5);
    if(!cand.length)return map;const pairs=[];
    for(const s of sh)for(const m of cand)pairs.push({s,m,c:Math.hypot(m.x-s.x,m.z-s.z)*(m.victim?1:2.4)});
    pairs.sort((a,b)=>a.c-b.c);const used=new Set();
    for(const p of pairs){if(map.has(p.s)||used.has(p.m))continue;map.set(p.s,p.m);used.add(p.m);}
    for(const s of sh)if(!map.has(s)){const p=pairs.find(q=>q.s===s);if(p)map.set(s,p.m);}
    return map;};
  const tagCheck=()=>{for(const s of ag){if(!s.shark||t<s.freeze)continue;for(const m of ag){if(m.shark||!m.victim||m.state!=='go')continue;
    if(Math.hypot(m.x-s.x,m.z-s.z)<2.6){m.shark=true;m.state='shark';m.freeze=t+0.7;m.vmax=13.2;m.turn=0;m.hx=clamp(m.x,-18,18);m.hz=m.z;s.freeze=t+0.4;tags.push({t,x:m.x,z:m.z});}}}};
  const rec=ag.map(()=>({x:[],z:[],tm:[],lk:[],ch:[]}));
  const record=()=>ag.forEach((a,i)=>{const r=rec[i];r.x.push(a.x);r.z.push(a.z);r.tm.push(a.shark?1:0);
    r.lk.push(!a.shark&&(a.state==='wait'||a.state==='done')?0:a.shark&&a.sp<1?sideX:NaN);r.ch.push(a===winner&&t>=winT?1:0);});
  const stepAll=()=>{const alive=ag.filter(a=>!a.shark);sideX=alive.length?alive.reduce((v,a)=>v+a.x,0)/alive.length:0;
    const map=active?assign():new Map();for(const a of ag){if(a.shark)stepShark(a,map);else stepMinnow(a);}
    if(active)tagCheck();t+=dt;record();};
  const idle=d=>{const te=t+d;while(t<te-1e-9)stepAll();};
  const startRound=(dir,nv,power)=>{rT.push(t);active=true;const alive=ag.filter(a=>!a.shark);
    alive.forEach(m=>{m.state='go';m.dir=dir;m.goT=t+m.react;m.victim=false;m.power=power;m.wp=0;
      if(power){m.wps=[[2+rnd()*5,m.z+(rnd()-0.5)*5],[19-rnd()*4,m.z+(rnd()-0.5)*5]];m.stopX=-40-rnd()*9;}});
    const pool=alive.slice();for(let k=0;k<nv&&pool.length>1;k++)pool.splice(Math.floor(rnd()*pool.length),1)[0].victim=true;};
  const runRound=()=>{const t0=t;while(!ag.every(a=>a.shark||a.state==='done')&&t<t0+26)stepAll();active=false;homes();};
  setup(1);record();idle(3.0);
  let dir=-1;const roundStarts=[];
  for(let r=0;r<6;r++){const n=ag.filter(a=>!a.shark).length;if(n<=1)break;
    roundStarts.push(t);startRound(dir,r===0?3:n-1,false);runRound();idle(1.3);dir=-dir;}
  winner=ag.find(a=>!a.shark)||null;winT=t;if(winner)fx.push({kind:'confetti',t0:t,t1:t+3,at:[winner.x,winner.z]});
  idle(2.8);const tf=t+0.55;idle(0.55);setup(1);winner=null;idle(1.6);
  const tPow=t;startRound(-1,3,true);runRound();idle(2.0);const TEND=t;
  tags.forEach(g=>fx.push({kind:'burst',t0:g.t,t1:g.t+1.0,at:[g.x,g.z],r:5}));
  const N=rec[0].x.length,kf0=Math.round(tf/dt),CX=new Float32Array(N);
  for(let k=0;k<N;k++){let v=0,n=0;rec.forEach(r=>{if(!r.tm[k]){v+=r.x[k];n++;}});CX[k]=clamp(0.42*(n?v/n:0),-20,20);}
  const ema=(a,b,st)=>{for(let k=a+st;st>0?k<b:k>=b;k+=st)CX[k]=lerp(CX[k-st],CX[k],0.035);};
  ema(0,kf0,1);ema(kf0,N,1);ema(kf0-1,0,-1);ema(N-1,kf0,-1);
  const camX=t=>{const f=clamp(t/dt,0,N-1),k=Math.floor(f);return lerp(CX[k],CX[Math.min(N-1,k+1)],f-k);};
  ag.forEach((a,i)=>{const r=rec[i];A.push({id:a.id,team:'blue',fn:t=>{const f=clamp(t/dt,0,N-1),k=Math.floor(f),u=f-k,k2=Math.min(N-1,k+1);
    const s={x:lerp(r.x[k],r.x[k2],u),z:lerp(r.z[k],r.z[k2],u),team:r.tm[k]?'red':'blue',stick:false,seed:i*1.37};
    if(!isNaN(r.lk[k]))s.lookAt=[r.lk[k],s.z];if(r.ch[k])s.pose='cheer';return s;}});});
  const flash=t=>{let v=0;for(const r of rT)v=Math.max(v,hump(t-r-0.3,0.5));return v;};
  const sticks=[];[-27,-21,-15,-9,9,15,21,27].forEach((z,i)=>sticks.push({type:'stick',at:[94.6,z],a:PI/2+(hash(i)-0.5)*0.3,len:5}));
  sticks.push({type:'stick',at:[96.6,-5.5],a:PI/2+0.1,len:5},{type:'stick',at:[96.6,5.5],a:PI/2-0.12,len:5});
  return{name:'Sharks & Minnows',cam:t=>({target:[camX(t),0,0],yaw:PI/2,pitch:1.08,w:170,h:88}),actors:A,fx,fades:[{m:tf,h:0.55}],
    props:[{type:'zone',x0:-25,x1:25,col:'232,57,77',alpha:t=>0.12+0.22*flash(t)},...sticks],
    meta:{roundStarts,tPow,tags:tags.length,TEND},
    steps:[[0,TEND]]};
}

// ===== render =====
function pushObj(objs,x,y,z,fn){const c=toCam(x,y,z);if(c[2]<NEAR)return;objs.push({d:c[2],fn});}
function glow(p,col,r){const c=toCamP(p);if(c[2]<NEAR)return;const s=projC(c),rr2=r*cam.F/c[2]*1.6;const g=ctx.createRadialGradient(s[0],s[1],0,s[0],s[1],rr2);
  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s[0],s[1],rr2,0,TAU);ctx.fill();}
function dashed(a,b,col){const s=seg2(a,b);if(!s)return;ctx.save();ctx.setLineDash([7,6]);ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);ctx.lineTo(s[1][0],s[1][1]);ctx.stroke();ctx.restore();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(s[1][0],s[1][1],4,0,TAU);ctx.fill();}
function drawNoodle(a,b,k){const d=norm(sub(b,a)),n=[-d[1]*0.55,d[0]*0.55];
  fillPoly([[a[0]+n[0],0.01,a[1]+n[1]],[b[0]+n[0],0.01,b[1]+n[1]],[b[0]-n[0],0.01,b[1]-n[1]],[a[0]-n[0],0.01,a[1]-n[1]]],'rgba(15,35,55,.22)');
  ctx.save();ctx.lineCap='round';line3([a[0],0.42*k,a[1]],[b[0],0.42*k,b[1]],0.8*k,'#e0303f',2);line3([a[0],0.62*k,a[1]],[b[0],0.62*k,b[1]],0.22*k,'rgba(255,255,255,.55)',1);ctx.restore();}
function fxDraw(f,t,bodies){
  const age=t-f.t0,dur=f.t1-f.t0,fade=1-ramp(t,f.t1-0.35,f.t1);let at=f.at;
  if(typeof at==='string'){const b=bodies[at];if(!b)return;at=[b.feet[0][0],b.feet[0][2]];}
  if(f.kind==='burst'){const k=easeOut(ramp(age,0,0.7)),r=0.8+(f.r||6)*k,col=f.c||GOALC;
    ctx.globalAlpha=fade*(1-0.55*k);fillRing(circ(at[0],at[1],r+0.4,0.03,36),circ(at[0],at[1],Math.max(0.1,r-0.4),0.03,36),`rgb(${col})`);
    ctx.globalAlpha=fade*(1-k);glow([at[0],1.8,at[1]],`rgba(${col},.95)`,1.8+2.4*k);ctx.globalAlpha=1;}
  else if(f.kind==='snow'){const c0=add(at,mul(dirA(f.dir),1.4));ctx.globalAlpha=fade*0.55*ramp(age,0.15,0.5);fillPoly(circ(c0[0],c0[1],1.3,0.02,14),'#ffffff','rgba(140,170,200,.5)');
    for(let i=0;i<18;i++){const r1=hash(i+f.t0*13),r2=hash(i*2.7+f.t0*7),r3=hash(i*5.3+f.t0*3),a=f.dir+(r1-0.5)*1.4,v=7+r2*9,
      d=v*(1-Math.exp(-age*3.2))/3.2,ya=Math.min(age/0.55,1),y=(0.6+r3*1.6)*Math.sin(ya*PI),
      x=at[0]+Math.cos(a)*d,z=at[1]+Math.sin(a)*d,c=toCam(x,y+0.1,z);if(c[2]<NEAR)continue;const p=projC(c),rad=Math.max(1,(0.22+0.2*r3)*cam.F/c[2]);
      ctx.globalAlpha=fade*0.95;ctx.fillStyle='#ffffff';ctx.strokeStyle='rgba(120,150,185,.7)';ctx.lineWidth=0.8;ctx.beginPath();ctx.arc(p[0],p[1],rad,0,TAU);ctx.fill();ctx.stroke();}
    ctx.globalAlpha=1;}
  else if(f.kind==='confetti'){const cols=['#ffd23f','#2f86e0','#e8394d','#2fbf71','#ffffff'];
    for(let i=0;i<34;i++){const r1=hash(i*1.3+f.t0),r2=hash(i*4.1+f.t0),r3=hash(i*7.7+f.t0),a=r1*TAU,rad=1.2+r2*5.5,
      x=at[0]+Math.cos(a+age*0.9)*rad,z=at[1]+Math.sin(a+age*0.9)*rad,y=Math.max(0.15,9+r3*4-age*3.6),c=toCam(x,y,z);if(c[2]<NEAR)continue;
      const p=projC(c),s=Math.max(1.6,0.55*cam.F/c[2]);ctx.globalAlpha=fade;ctx.fillStyle=cols[i%5];ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(age*6+i);ctx.fillRect(-s,-s*0.5,2*s,s);ctx.restore();}
    ctx.globalAlpha=1;}
}
function render(){
  const D=CUR,t=Math.min(S.t,D.T);
  setCam(typeof D.cam==='function'?D.cam(t):D.cam);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1a2838');bg.addColorStop(1,'#0a1018');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawWalls(false);drawIce();
  const objs=[];
  for(const p of D.props){
    if(p.t0!=null&&t<p.t0)continue;if(p.t1!=null&&t>=p.t1)continue;
    const sc=p.t0!=null?backOut(ramp(t,p.t0,p.t0+0.45)):1;
    if(p.type==='cone'){const at=p.at;pushObj(objs,at[0],0.6,at[1],()=>drawCone(at[0],at[1],sc));}
    else if(p.type==='tire')pushObj(objs,p.at[0],0.4,p.at[1],()=>drawTire(p.at[0],p.at[1],sc));
    else if(p.type==='pile')pushObj(objs,p.at[0],0.2,p.at[1],()=>{for(const[dx,dz,y]of[[0,0,0],[0.9,0.4,0],[-0.5,0.9,0],[0.3,0.4,0.24]])drawPuck(p.at[0]+dx,y,p.at[1]+dz);});
    else if(p.type==='stick'){const L=(p.len||5)/2,d=dirA(p.a),a=[p.at[0]-d[0]*L,0.05,p.at[1]-d[1]*L],b=[p.at[0]+d[0]*L,0.05,p.at[1]+d[1]*L];
      ctx.globalAlpha=clamp(sc,0,1);line3(a,b,0.16,'#9a6f35',2);line3(a,b,0.11,STICK,1.5);line3(b,[b[0]+d[1]*0.9,0.05,b[2]-d[0]*0.9],0.26,'#1d1d1f',2);ctx.globalAlpha=1;}
    else if(p.type==='route')drawRoute(p.pts,p.col,typeof p.alpha==='function'?p.alpha(t):(p.alpha||0.8),p.arrow);
    else if(p.type==='dash'){const Lg=Math.hypot(p.b[0]-p.a[0],p.b[1]-p.a[1]);for(let d=0;d<Lg;d+=7.5){const A2=L2(p.a,p.b,d/Lg),B2=L2(p.a,p.b,Math.min(1,(d+4.6)/Lg));line3([A2[0],0.05,A2[1]],[B2[0],0.05,B2[1]],1.05,p.col||'#e0303f',1.5);}}
    else if(p.type==='noodle'){const m=L2(p.a,p.b,0.5);pushObj(objs,m[0],0.4,m[1],()=>drawNoodle(p.a,p.b,sc));}
    else if(p.type==='zone'){const a=typeof p.alpha==='function'?p.alpha(t):p.alpha;fillPoly([[p.x0,0,-42.5],[p.x1,0,-42.5],[p.x1,0,42.5],[p.x0,0,42.5]],`rgba(${p.col},${a})`);}
    else if(p.type==='spot'){const a=Math.min(ramp(t,p.t0,p.t0+0.3),1-ramp(t,p.t1-0.3,p.t1));fillPoly(circ(p.at[0],p.at[1],p.r,0.02,28),`rgba(${p.col},${0.42*a})`,`rgba(${p.col},${0.95*a})`,2);}
  }
  for(const n of(D.nets||[{x:89,z:0,a:PI},{x:-89,z:0,a:0}])){const f=dirA(n.a),k=n.s||1;pushObj(objs,n.x-f[0]*1.7*k,2*k,n.z-f[1]*1.7*k,()=>drawNetAt(n.x,n.z,n.a,k));}
  const acts=[],bodies={};
  for(const a of D.actors){const s=evalActor(a,t);if(!s.hidden)acts.push(s);}
  for(const s of acts){const b=buildBody(s,t);bodies[s.id]=b;
    fillPoly(circ(s.x,s.z,1.25*b.S,0.01,14),'rgba(15,35,55,.18)');
    if(s.ring){const r=2.3+0.25*Math.sin(t*9);fillRing(circ(s.x,s.z,r+0.32,0.02,24),circ(s.x,s.z,r-0.32,0.02,24),s.ring);}
    pushObj(objs,s.x,2,s.z,()=>drawPrims(b.pr));}
  for(const pf of D.pucks){const p=pf(t);if(!p)continue;const q=pf(t-0.24);
    if(q&&Math.hypot(p[0]-q[0],p[2]-q[2])>2.5){let prev=q;for(let k=5;k>=0;k--){const r=pf(t-0.04*k);if(!r)continue;ctx.globalAlpha=0.5*(1-k/6);line3([prev[0],0.03,prev[2]],[r[0],0.03,r[2]],0.35,'#1d2c3c');prev=r;}ctx.globalAlpha=1;}
    pushObj(objs,p[0],p[1]+0.1,p[2],()=>drawPuck(p[0],p[1],p[2]));}
  objs.sort((a,b)=>b.d-a.d);for(const o of objs)o.fn();
  drawWalls(true);
  for(const s of acts){const b=bodies[s.id];
    if(s.sightTo&&bodies[s.sightTo])dashed(b.head,bodies[s.sightTo].head,'#ffd23f');
    if(s.sightPt)dashed(b.head,[s.sightPt[0],0.8,s.sightPt[1]],'#ffd23f');}
  for(const f of D.fx)if(t>=f.t0&&t<f.t1)fxDraw(f,t,bodies);
  let fa=0;for(const f of D.fades)fa=Math.max(fa,1-Math.abs(t-f.m)/f.h);
  fa=Math.max(fa,1-ramp(S.t,0,0.5),ramp(S.t,D.T+HOLD-0.5,D.T+HOLD));
  if(fa>0.002){ctx.fillStyle=`rgba(8,12,18,${Math.min(1,fa).toFixed(3)})`;ctx.fillRect(0,0,W,H);}
}

// ===== state & UI =====
const DRILLS=[dBorder(),dTurns(),dSingle(),d3on1(),dSharks()].map(d=>{d.byId={};d.actors.forEach(a=>d.byId[a.id]=a);d.T=d.steps[d.steps.length-1][1];
  d.pucks=d.pucks||[];d.fx=d.fx||[];d.props=d.props||[];d.fades=d.fades||[];return d;});
const HOLD=1.5,S={di:0,t:0,playing:true};
const $=id=>document.getElementById(id),tabs=$('tabs');
DRILLS.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='tab';b.textContent=d.name;b.onclick=()=>{selectDrill(i);wake();};tabs.appendChild(b);});
function selectDrill(i){S.di=i;CUR=DRILLS[i];S.t=0;S.playing=true;view.yaw=view.pitch=0;view.zoom=1;
  [...tabs.children].forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-pressed',String(j===i));});
  const tb=tabs.children[i];if(tb&&tb.scrollIntoView)tb.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
function rateAt(t){for(const s of CUR.steps)if(t>=s[0]&&t<s[1])return s[2]||1;return 1;}
function tick(dt){if(!S.playing)return;S.t+=dt*(S.t<CUR.T?rateAt(S.t):1);if(S.t>=CUR.T+HOLD)S.t=0;}
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();S.playing=!S.playing;}
  else if(e.key==='ArrowRight')selectDrill((S.di+1)%DRILLS.length);else if(e.key==='ArrowLeft')selectDrill((S.di+DRILLS.length-1)%DRILLS.length);});
// screen stays awake while watching (where supported)
let wl=null,wantWake=false;
async function wake(){wantWake=true;try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){wl=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wantWake)wake();});
// full screen toggle (hidden where the browser can't do it, e.g. iPhone)
const fsBtn=$('fs'),de=document.documentElement,reqFS=de.requestFullscreen||de.webkitRequestFullscreen,
  exitFS=document.exitFullscreen||document.webkitExitFullscreen,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(reqFS&&(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsBtn.hidden=false;
const fsIcon=()=>{$('fsIcon').setAttribute('d',fsEl()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');};
fsBtn.onclick=()=>{wake();try{if(fsEl())exitFS.call(document);else{const r=reqFS.call(de);if(r&&r.catch)r.catch(()=>{});}}catch(e){}};
document.addEventListener('fullscreenchange',fsIcon);document.addEventListener('webkitfullscreenchange',fsIcon);
// camera interaction: drag to spin, pinch/scroll to zoom, double-tap to reset
const ptrs=new Map();let pinch0=0,lastTap=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});wake();
  const now=performance.now();if(now-lastTap<300&&ptrs.size===1){view.yaw=view.pitch=0;view.zoom=1;}lastTap=now;});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){view.yaw-=dx*0.008;view.pitch=clamp(view.pitch+dy*0.005,-1.2,1.2);}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)view.zoom=clamp(view.zoom*pinch0/d,0.35,2.5);pinch0=d;}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();view.zoom=clamp(view.zoom*Math.exp(e.deltaY*0.001),0.35,2.5);},{passive:false});
function resize(){const r=$('stage').getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;BAR=tabs.getBoundingClientRect().height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
new ResizeObserver(resize).observe($('stage'));new ResizeObserver(resize).observe(tabs);resize();
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;tick(dt);try{render();}catch(err){console.error(err);}requestAnimationFrame(loop);}
selectDrill(0);requestAnimationFrame(loop);

})();
</script>
